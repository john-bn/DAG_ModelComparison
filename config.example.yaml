# Example configuration for the comparator CLI.
#
# Copy to config.yaml and edit. Resolution precedence (highest first):
#   CLI flag  >  environment variable (DAG_*)  >  this file  >  built-in default
#
# On the server, set ABSOLUTE paths here — the CGI/web-server working directory
# may differ from the project, so relative paths would resolve to the wrong place.
# For the web UI, point out_dir at the output/ subdir of your web-served
# directory so rendered images are reachable (see docs/DEPLOYMENT.md).

# --- Directories (absolute paths recommended on the server) ---
data_dir: /home/ACCU/john.needham/dag/data       # GRIB downloads + regridder weight cache
out_dir:  /home/ACCU/john.needham/dag/figures     # PNG/GIF outputs + runs.jsonl manifest
log_dir:  /home/ACCU/john.needham/dag/logs        # comparison.log (rotating)

# --- Default verification analysis: rtma or urma ---
verif: rtma

# --- Rolling real-time defaults (used by `compare run` without an explicit --date) ---
rolling:
  lag_hours: 2        # subtract from the current hour to pick the analysis time
  default_lead: 24    # preferred forecast lead (hours) to verify in single mode
