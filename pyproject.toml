[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comparator"
version = "0.0.0"
requires-python = ">3.11"
# Only the pure-Python deps are declared here. The heavy scientific stack
# (herbie, cartopy, xarray, cfgrib/eccodes, ...) is provided by the pixi
# environment in pixi.toml — do not try to pip-install it.
dependencies = ["pyyaml"]

[project.scripts]
compare = "comparator.cli:main"
compare-web = "comparator.webserver:main"

[tool.setuptools.packages.find]
include = ["comparator"]

[tool.setuptools.package-data]
# Ship the web form template so an installed package can serve the form and
# `render-form` can find it.
comparator = ["web/*.html"]
