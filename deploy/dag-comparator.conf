# Reverse proxy to the always-on `compare-web serve` daemon
# (deploy/run_dag_server.sh), replacing the old build.cgi/.htaccess approach.
#
# Requires mod_proxy + mod_proxy_http (verify with `httpd -M | grep proxy` or
# `apache2ctl -M | grep proxy`). Adjust the /dag/ path and port below to match
# your deployment, drop this file where your httpd config includes it, then
# reload (`apachectl graceful` / `systemctl reload httpd`, whichever you have
# permission for).

ProxyPreserveHost On

<Location /dag/>
    # timeout= covers the animated-GIF case, which can run several minutes —
    # well past mod_proxy's default (60s). Single-frame builds finish in tens
    # of seconds.
    ProxyPass        http://127.0.0.1:8000/ timeout=300
    ProxyPassReverse http://127.0.0.1:8000/
</Location>
